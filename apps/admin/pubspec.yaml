name: prescription_scanner_admin
description: Flutter Web admin console for Prescription Scanner.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  supabase_flutter: ^2.8.0
  hive_flutter: ^1.1.0
  # Reused from mobile app: Firestore-backed admin API key pool (Gemini keys).
  admin_api_key_manager:
    git:
      url: https://github.com/Keshab1997/admin_api_key_manager
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
