name: prescription_scanner
description: Privacy-first AI prescription transcription by Keshab Studios.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.5.0
  supabase_flutter: ^2.17.1
  google_mobile_ads: ^9.1.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  intl: ^0.20.2
  # Reused from SpeakEasy: Firestore-backed admin API key pool (Gemini keys).
  admin_api_key_manager:
    git:
      url: https://github.com/Keshab1997/admin_api_key_manager
      ref: master
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  hive_flutter: ^1.1.0
  http: ^1.2.0
  uuid: ^4.4.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/app_icon.png
