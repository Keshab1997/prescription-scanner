name: App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze and test (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Check formatting
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run tests
        working-directory: apps/mobile
        run: flutter test

  admin-web:
    name: Analyze and test (Admin Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.4
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/admin
        run: flutter pub get

      - name: Check formatting
        working-directory: apps/admin
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: apps/admin
        run: flutter analyze

      - name: Run tests
        working-directory: apps/admin
        run: flutter test
